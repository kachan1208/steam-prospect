# DigitalOcean App Platform spec for Prospect.
#
# Two ways to use it:
#   • UI (easiest): DO panel → Apps → Create → connect GitHub → pick this repo. DO auto-detects
#     the Dockerfile; you only add the env vars below in the "Environment Variables" step.
#   • CLI: `doctl apps create --spec .do/app.yaml` (after editing the two placeholders).
#
# Edit the two ⬇ placeholders before using the CLI path.

name: prospect
region: nyc

services:
  - name: web
    # --- source: build from your GitHub repo, redeploy automatically on push ---
    github:
      repo: kachan1208/steam-prospect
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    source_dir: /

    # --- runtime ---
    http_port: 8080
    instance_count: 1
    # 512MB / ~$5/mo — the cheapest slug, and the one the live App Platform app was created
    # with (see .do/app.git.yaml). Whether it FITS has never been measured: production is the
    # droplet, and this app is the legacy path (DEPLOY.md "Legacy appendix"). DuckDB streams
    # the ~557MB mart off disk rather than loading it into RAM, so one worker is plausible
    # here — but if the instance OOM-restarts, the remedy is to bump this to basic-xs (1GB).
    # WEB_CONCURRENCY below is already at its minimum of 1 and cannot absorb it.
    instance_size_slug: basic-xxs
    health_check:
      # /api/health/ready (NOT /api/health): readiness returns 503 until the mart is
      # actually loaded, so App Platform stops routing traffic to an instance that boots
      # fine but has no data. DEPENDENCY: that endpoint ships with the API branch that adds
      # it — with a build that predates it this path 404s and every health check fails.
      http_path: /api/health/ready
      # 45s was never enough: the boot-time mart download is ~557MB, and App Platform kills
      # the instance when the check fails, so a slow download became a crash loop.
      initial_delay_seconds: 120

    envs:
      # The entrypoint defaults to 2 workers, which is right for the 2-vCPU droplet. Each
      # uvicorn worker opens its OWN DuckDB connection + cursor pool, so on a 512MB instance
      # one worker is the only setting with a chance of fitting.
      - key: WEB_CONCURRENCY
        scope: RUN_TIME
        value: "1"
      # The API downloads the analytics DB from here on boot (a GitHub Release asset, ≤2GB).
      - key: PROSPECT_DUCKDB_URL
        scope: RUN_TIME
        value: https://github.com/kachan1208/steam-prospect/releases/download/data-latest/current.duckdb
      # These match the Dockerfile defaults; listed so they're visible/overridable in the UI.
      - key: PROSPECT_STATIC_DIR
        scope: RUN_TIME
        value: /app/web_dist

# Route all traffic to the single web service (it serves both the SPA and /api).
ingress:
  rules:
    - match:
        path:
          prefix: /
      component:
        name: web
