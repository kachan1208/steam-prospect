name: CI

# Track O2 (prospect-production-and-marketing-plan.md): stop shipping blind. Independent
# jobs (disjoint concerns, same split the codebase itself uses: web / api / etl / mcp, plus
# the deploy + image checks) so a failure in one doesn't hide the others' signal. Nothing
# here needs the real ~557MB data/current.duckdb or the 5.2GB source catalog:
# api/tests/conftest.py builds its own tiny synthetic mart at test time, and mcp/smoke_test.py
# runs against a small, curated, REAL-data-derived fixture committed at
# .github/fixtures/mcp_smoke_mart.db (see .github/fixtures/README.md).
"on":
  # `push:` used to be unfiltered, so a commit on a PR branch fired BOTH a push run and a
  # pull_request run — the whole matrix, twice, for every push. Restricting push to the
  # default branch is the actual dedupe: branch commits are covered by their PR run, and
  # main still gets a run of its own after a merge.
  push:
    branches: [main]
  pull_request:

# Second half of the same fix. The old group was `${{ github.ref }}`, which does NOT dedupe
# push vs pull_request: on a PR branch github.ref is `refs/heads/<branch>` for the push event
# and `refs/pull/<n>/merge` for the pull_request event — two different groups, so both runs
# survived. Key on the PR number when there is one, so every event for a PR shares one group
# and only the newest commit's run stays alive.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least privilege for the whole workflow: read the checkout, nothing else. Jobs that need
# more would widen ONLY themselves via a job-level block —
# GITHUB_TOKEN should never arrive with write scopes it isn't going to use.
permissions:
  contents: read

jobs:
  web:
    name: Web (typecheck, build, vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Must match the image's build stage (Dockerfile: node:22-slim) — a lockfile that
          # installs under one major can still bite the other on engine-gated transitive deps.
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      # Was continue-on-error while tsconfig.node.json (a composite referenced project with
      # no explicit `noEmit`) made `tsc -b --noEmit` fail with TS6310. That tsconfig fix
      # landed separately, so this is blocking again — the whole point of the job.
      - name: Typecheck (tsc -b --noEmit)
        working-directory: web
        run: npm run typecheck

      - name: Build (tsc -b + vite build)
        working-directory: web
        run: npm run build

      - name: Vitest
        working-directory: web
        run: npm run test

  api:
    name: API (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      # Install the PINNED set the image installs, so CI tests what production runs.
      - name: Install API dependencies (locked)
        working-directory: api
        run: pip install -r requirements.lock

      # Test-only extras live in requirements-dev.txt, which arrives with a separate branch;
      # guarded so this workflow is green both before and after that lands.
      - name: Install API dev dependencies (if present)
        working-directory: api
        run: if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Run pytest
        working-directory: api
        # cwd must be `api/` (not `api/tests/`) so `from app...` imports resolve — `python
        # -m pytest` puts the current directory on sys.path; see api/tests/conftest.py's
        # module docstring for the full ordering story (env vars + fixture mart must exist
        # before app.main is ever imported).
        run: python -m pytest tests/ -v

  locks:
    name: Dependency locks in sync
    runs-on: ubuntu-latest
    # A lock that has drifted from its requirements.txt is worse than no lock: the image
    # silently keeps installing the old pins while the source file claims otherwise.
    # Recompile all three and fail on any diff.
    #
    # mcp/ is checked too (added 2026-08-29): `mcp>=1.2` resolving to 2.0.0 on a rebuild is
    # the outage this whole job exists for, and mcp/requirements.txt was the one file with
    # that dependency still unlocked.
    #
    # STABILITY — this check must only ever go red for the reason it claims (the committed
    # lock does not match the committed requirements.txt). Two things used to break that:
    #   * uv itself was unpinned, so a uv release that changed output formatting would fail
    #     every unrelated PR.  -> UV_VERSION below.
    #   * the resolution ran against LIVE PyPI, so a transitive dependency publishing a new
    #     release turned every unrelated PR red.  -> EXCLUDE_NEWER below, which freezes the
    #     resolver's view of the index at the instant the committed locks were generated.
    # Bump both and regenerate the locks in the SAME commit; never one without the other.
    env:
      UV_VERSION: "0.12.7"
      EXCLUDE_NEWER: "2026-08-29T00:00:00Z"
      LOCK_ARGS: "--python-version 3.14 --python-platform x86_64-unknown-linux-gnu"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install uv (pinned)
        run: pip install "uv==${UV_VERSION}"

      - name: Recompile and diff
        run: |
          set -euo pipefail
          for d in api etl mcp; do
            # uv stamps its VERBATIM command line — INCLUDING `-o <target>` — into the lock's
            # header comment. This job compiles to /tmp/$d.lock and diffs against the committed
            # $d/requirements.lock, so that header line always differed and `diff -u` always
            # exited 1: the job could never pass, and its own "regenerate with -o
            # $d/requirements.lock" advice reproduced the committed header, so following it
            # could not help either. UV_CUSTOM_COMPILE_COMMAND overrides that header with the
            # canonical regenerate command, which makes it independent of where CI writes the
            # file AND makes the header a copy-pasteable, byte-exact reproduction recipe.
            cmd="uv pip compile $d/requirements.txt -o $d/requirements.lock $LOCK_ARGS --exclude-newer $EXCLUDE_NEWER"
            # shellcheck disable=SC2086  # LOCK_ARGS is a deliberate word-split argument list
            UV_CUSTOM_COMPILE_COMMAND="$cmd" uv pip compile "$d/requirements.txt" -o "/tmp/$d.lock" \
              $LOCK_ARGS --exclude-newer "$EXCLUDE_NEWER" --quiet
            if ! diff -u "$d/requirements.lock" "/tmp/$d.lock"; then
              echo "::error::$d/requirements.lock is out of date — regenerate it with uv $UV_VERSION:"
              echo "  pip install uv==$UV_VERSION"
              echo "  UV_CUSTOM_COMPILE_COMMAND='$cmd' $cmd"
              echo "  (that command is also line 2 of $d/requirements.lock)"
              exit 1
            fi
          done

  etl:
    name: ETL (mart invariants)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      # pytest is NOT in etl/requirements.txt on purpose: that file describes what the droplet's
      # ETL venv installs, and it is kept deliberately thin (the aspect classifier is
      # dependency-free for exactly this reason). Test-only tooling belongs here, not there.
      # The lock is CI's pinned view of that same file; the droplet venv is managed separately.
      - name: Install ETL dependencies (locked)
        working-directory: etl
        run: pip install -r requirements.lock pytest

      - name: Run mart invariant tests
        working-directory: etl
        # cwd must be `etl/` so the tests can `import build_marts` — `python -m pytest` puts the
        # current directory on sys.path. Needs no source database: the tests render the real .sql
        # files against a synthetic staging layer in an in-memory DuckDB.
        run: python -m pytest tests/ -v

  mcp-smoke:
    name: MCP smoke test (curated real-data fixture)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      # From the LOCK, like the api/etl jobs: the whole point of locking mcp/ is that CI
      # exercises the same resolved SDK the image would get, not whatever PyPI serves today.
      - name: Install MCP dependencies (locked)
        working-directory: mcp
        run: pip install -r requirements.lock

      - name: Run MCP smoke test
        working-directory: mcp
        env:
          PROSPECT_ANALYTICS_DB_PATH: ${{ github.workspace }}/.github/fixtures/mcp_smoke_mart.db
        run: python smoke_test.py

  ruff:
    name: "Python lint (ruff: hard errors)"
    runs-on: ubuntu-latest
    # The catch-the-hard-errors net: syntax errors, undefined names, redefinitions and the
    # rest of pyflakes, across every Python tree the image ships. Deliberately a SEPARATE
    # job: it must stay green for reasons it controls, never blocked on pytest runtime.
    env:
      # PINNED, same discipline as UV_VERSION/SHELLCHECK_VERSION — an unpinned linter means
      # a new release's rule tweaks fail every unrelated PR. 0.13.1 is the version the
      # ruleset below was verified clean against (locally, on this tree, 2026-09-01).
      RUFF_VERSION: "0.13.1"
    steps:
      - uses: actions/checkout@v4

      - name: Install ruff (pinned)
        run: pip install "ruff==${RUFF_VERSION}"

      - name: Run ruff (E9 + pyflakes, minus the pre-existing etl debt below)
        # E9,F was the starting candidate and is NOT clean on this tree: etl/ carries four
        # F401 unused imports, one F541 placeholder-less f-string, and two F601 duplicate
        # dict-key literals. The first two are cosmetic; F601 (both in etl/build_marts.py)
        # is a real latent bug — the later key silently wins. They live in a tree this
        # check was not allowed to edit, so they are IGNORED here rather than fixed, and
        # dropping each ignore is the follow-up: clean the finding, remove it from
        # --ignore, nothing else. Until then this job still catches every NEW hard error.
        run: ruff check --select E9,F --ignore F401,F541,F601 api etl mcp

  shellcheck:
    name: Shellcheck (deploy scripts)
    runs-on: ubuntu-latest
    # These scripts ARE production: the nightly pipeline, the cron lock wrapper, backups and
    # rollback all run from the /root/prospect/deploy checkout on the droplet, where a typo
    # is discovered at 21:00 UTC by a missing mart. -x follows the sourced deploy/lib.sh.
    env:
      # PINNED, for the same reason UV_VERSION is. `apt install shellcheck` gave 0.9.0, whose
      # SC2317 ("command appears to be unreachable") fires on every line of a trap handler —
      # backup.sh's cleanup trap is exactly that, so the job failed on a false positive that
      # newer shellcheck does not emit. An unpinned linter means the runner image decides
      # whether CI is green, which is how a check stops meaning anything.
      SHELLCHECK_VERSION: "v0.11.0"
      # INTEGRITY: upstream publishes NO checksum file for its release assets (checked via
      # the GitHub release API 2026-09-01: 13 binaries, no SHA256SUMS among them), and none
      # could be computed at the time this was added, so the download is pinned by exact
      # version + exact asset URL over TLS to github.com only. The step below verifies
      # against this value the moment it is non-empty — if upstream ever ships a checksum
      # (or one is recorded by hand from a trusted download), paste it here and stop
      # trusting the pipe.
      SHELLCHECK_SHA256: ""
    steps:
      - uses: actions/checkout@v4

      - name: Run shellcheck
        run: |
          set -euo pipefail
          archive="/tmp/shellcheck.tar.xz"
          curl -fsSL -o "$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          if [ -n "$SHELLCHECK_SHA256" ]; then
            echo "${SHELLCHECK_SHA256}  ${archive}" | sha256sum -c -
          else
            echo "::warning::shellcheck ${SHELLCHECK_VERSION} accepted without sha256 — upstream publishes none; see SHELLCHECK_SHA256 in the workflow"
          fi
          tar -xJf "$archive" -C /tmp
          rm -f "$archive"
          SC="/tmp/shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          "$SC" --version
          "$SC" -x deploy/*.sh

  docker:
    name: Docker image (build + smoke)
    runs-on: ubuntu-latest
    # No packages:write — nothing is published (see below). The workflow-level
    # `contents: read` is all this job needs, so it does not widen anything.
    # The Dockerfile had never been built in CI, and an unpinned dependency resolving
    # differently on a rebuild (mcp>=1.2 -> 2.0) already took /mcp down in production once.
    #
    # BUILD AND SMOKE ONLY — deliberately NO registry push (2026-09-01). A push to ghcr.io
    # was drafted here alongside a comment saying "the droplet's deploy is a `docker pull`".
    # There is no `docker pull` anywhere: deploy/run-prospect.sh:24 does
    # `docker image inspect "$IMAGE" || exit 2`, refusing an image that is not already local,
    # and DEPLOY.md still documents building on the box. Publishing artefacts nothing consumes
    # costs multi-GB per merge with no retention policy, and documents a deploy path that does
    # not exist — worse than not publishing at all.
    #
    # Registry-based deploy is still the RIGHT direction and worth doing properly: the droplet
    # builds its own image today on a 3.9GB box, which is why builds are banned 06:00-19:00 UTC
    # (they fight the keepers for RAM, and doing it anyway once took production down). Wiring
    # it needs three things this change does not have: registry auth on the box, an image
    # retention policy, and a pull branch in run-prospect.sh. Do those together, deliberately.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the image (loaded for the smoke tests below)
        uses: docker/build-push-action@v6
        with:
          context: .
          # load (not just cache export) so the built image is in the local daemon and the
          # MCP-SDK assertion + boot smoke run against the EXACT artifact that gets pushed.
          load: true
          tags: prospect:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # THE regression this job exists for, asserted directly. `mcp>=1.2` resolving to 2.0.0
      # on a routine rebuild dropped `mcp.server.fastmcp` — the module mcp/prospect_mcp.py
      # imports — so load_prospect_mcp() caught ModuleNotFoundError, skipped the /mcp mount,
      # and the app came up looking perfectly healthy with /mcp 404ing.
      #
      # It has to be asserted THIS way and not over HTTP: mcp/prospect_mcp.py raises
      # FileNotFoundError at import time when there is no mart, so /mcp is legitimately
      # unmounted in a dataless container and an HTTP probe of /mcp cannot tell "SDK broke"
      # from "no data". Importing the module the SDK must provide can.
      - name: Assert the image still has the MCP SDK module /mcp needs
        run: docker run --rm --entrypoint python prospect:ci -c "import mcp.server.fastmcp"

      - name: Smoke the built image
        # Boots with no PROSPECT_DUCKDB_URL, which the entrypoint handles by design (degraded
        # mode: API up, data endpoints 503). Proves the image starts and serves HTTP — a
        # build that succeeds but crash-loops on boot is still a broken deploy. It does NOT
        # prove the app can serve data (there is no mart here on purpose — the ~557MB one is
        # not in CI); that is the api job's synthetic-mart tests. So assert exactly what a
        # dataless boot SHOULD produce — a well-formed health body reporting "degraded" — and
        # not merely "something answered on port 8080".
        run: |
          set -euo pipefail
          docker run -d --name prospect-ci -p 8080:8080 prospect:ci
          for i in $(seq 1 30); do
            if body=$(curl -sf -m 5 http://localhost:8080/api/health); then
              echo "image is serving /api/health after ${i}s: $body"
              echo "$body" | grep -q '"status":"degraded"' || {
                echo "::error::unexpected /api/health body for a dataless boot: $body"
                docker logs prospect-ci
                exit 1
              }
              exit 0
            fi
            sleep 1
          done
          echo "::error::image never answered /api/health"
          docker logs prospect-ci
          exit 1

